<!doctype html>
<!-- index.html: the one page of byo sub. app.js fills it in. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>byo sub</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>byo sub</h1>

    <p id="message" hidden></p>

    <section id="signed-out" hidden>
      <p>Chat on the ChatGPT plan you already pay for. No API key, no AI bill.</p>
      <button type="button" class="siwc" data-href="/auth/start"><img src="/chatgpt-mark.svg" alt="">Continue with ChatGPT</button>
    </section>

    <section id="signed-in" hidden>
      <p>Connected as <strong id="email"></strong> <button type="button" id="signout">Sign out</button></p>

      <div id="no-plan" hidden>
        <p>Plan usage is off. byo sub needs permission to use your ChatGPT plan before it can chat.</p>
        <button type="button" class="siwc" data-href="/auth/start?consent"><img src="/chatgpt-mark.svg" alt="">Continue with ChatGPT</button>
      </div>

      <div id="chat" hidden>
        <div class="bar">
          <label for="model">Model</label>
          <select id="model"></select>
          <span class="plan">Using ChatGPT plan · <a href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener">Manage usage</a></span>
        </div>
        <ol id="messages"></ol>
        <form id="composer">
          <label for="input" class="visually-hidden">Message</label>
          <textarea id="input" rows="2" placeholder="Ask anything…"></textarea>
          <button type="submit" id="send">Send</button>
        </form>
      </div>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
